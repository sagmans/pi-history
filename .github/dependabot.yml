# Dependabot policy. No package manager setting in this repository sets a
# minimum release age, so the cooldown is the only supply chain window: a fresh
# release must survive a week of public scrutiny before a bot proposes it.
# compat/pi-1.1.0 is not listed on purpose: its Pi pins are a fixed host
# baseline, and it is regenerated from package.json, not bumped on its own.
version: 2
updates:
  # CI actions are pinned to full SHAs; dependabot still proposes version bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      # Dependabot holds version updates for the cooldown below after
      # publication, so a grouped proposal can lag this weekly schedule without
      # the group being broken.
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # pi-coding-agent depends on pi-tui, and this repo also depends on it
      # directly. Separate proposals resolve two pi-tui copies, so typecheck
      # sees two distinct TUI types and fails; one group keeps them in lockstep.
      pi:
        patterns:
          - "@earendil-works/*"
      # A group applies to version updates only unless it says otherwise, so an
      # advisory fix for one Pi package would split the pair again and fail
      # typecheck the same way.
      pi-security:
        applies-to: security-updates
        patterns:
          - "@earendil-works/*"
      # Each toolchain bump forces a compat lockfile regeneration, so one
      # pull request for the routine bumps means one regeneration, not many.
      dev-toolchain:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/*"
        update-types:
          - minor
          - patch
