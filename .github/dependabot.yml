# Dependabot policy. No package manager setting in this repository sets a
# minimum release age, so the cooldown is the only supply chain window: a fresh
# release must survive a week of public scrutiny before a bot proposes it.
# The compat/ lockfiles are not listed on purpose: their Pi pins are fixed
# host baselines, regenerated from package.json, not bumped on their own.
version: 2
updates:
  # CI actions are pinned to full SHAs; dependabot still proposes version bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  # The dev lockfile tracks the current Pi host (^1.4.0). The pre-push
  # compatibility matrix tests the older tested hosts (0.87.0, 1.1.0, 1.3.0)
  # from their own committed lockfiles in compat/, so a root Pi update retires
  # no tested baseline and proposals inside the host line stay routine.
  - package-ecosystem: npm
    directory: /
    schedule:
      # Dependabot holds version updates for the cooldown below after
      # publication, so a grouped proposal can lag this weekly schedule without
      # the group being broken.
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Pi 2.0.0 and later are outside the tested host line: the dev range
      # ends below 2.0.0, and adopting a new major also moves the dev range,
      # the README host list and the compatibility matrix, so it stays a
      # deliberate decision. A versions rule binds security updates too, so no
      # proposal can reach them; updates inside the host line, advisory fixes
      # included, still open a pull request.
      - dependency-name: "@earendil-works/*"
        versions:
          - ">=2.0.0"
    groups:
      # pi-coding-agent depends on pi-tui, and this repo also depends on it
      # directly. Separate proposals resolve two pi-tui copies, so typecheck
      # sees two distinct TUI types and fails; one group keeps them in lockstep.
      pi:
        patterns:
          - "@earendil-works/*"
      # A group applies to version updates only unless it says otherwise, so an
      # advisory fix for one Pi package would split the pair again and fail
      # typecheck the same way.
      pi-security:
        applies-to: security-updates
        patterns:
          - "@earendil-works/*"
      # Each toolchain bump forces a compat lockfile regeneration, so one
      # pull request for the routine bumps means one regeneration, not many.
      dev-toolchain:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/*"
        update-types:
          - minor
          - patch
